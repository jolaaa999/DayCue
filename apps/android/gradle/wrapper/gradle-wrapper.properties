# Gradle Wrapper config.
# gradle-wrapper.jar is committed in this repo, so no local Gradle install is needed.
# Why 8.9: AGP 8.7.2 requires Gradle >= 8.9, and 8.9 is also a supported combination
# for Kotlin 2.0.21 + KSP 2.0.21-1.0.28.
# Before changing the version here, check gradle/libs.versions.toml for AGP compatibility.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists